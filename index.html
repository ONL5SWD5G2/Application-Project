<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Quiz | Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="page-wrap d-flex align-items-center py-5">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-12 col-sm-10 col-md-7 col-lg-5">
          <section class="card app-card">
            <div class="card-body p-4 p-md-5">
              <h1 class="brand-title text-center h2 mb-2">Student Quiz</h1>
              <p class="text-muted text-center mb-4">Sign in to continue your learning.</p>
              <div id="loginMessage"></div>
              <form id="loginForm" novalidate>
                <div class="mb-3">
                  <label for="loginEmail" class="form-label">Email</label>
                  <input type="email" class="form-control" id="loginEmail" placeholder="name@example.com">
                </div>
                <div class="mb-4">
                  <label for="loginPassword" class="form-label">Password</label>
                  <input type="password" class="form-control" id="loginPassword" placeholder="Enter your password">
                </div>
                <button type="submit" class="btn btn-primary w-100">Login</button>
              </form>
              <p class="text-center text-muted mt-4 mb-0">New student? <a href="register.html">Create an account</a></p>
            </div>
          </section>
        </div>
      </div>
    </div>
  </main>
  <script src="js/auth.js"></script>
</body>
</html>
