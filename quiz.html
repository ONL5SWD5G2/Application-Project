<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Quiz | Quiz</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="page-wrap py-4 py-md-5">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-12 col-lg-8">
          <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
              <p class="text-muted mb-0">Welcome, <span id="studentName" class="fw-semibold"></span></p>
              <h1 class="brand-title h2 mb-0">Web Basics Quiz</h1>
            </div>
            <button type="button" id="logoutButton" class="btn btn-outline-secondary">Logout</button>
          </div>
          <section class="card app-card">
            <div class="card-body p-4 p-md-5">
              <div id="quizMessage"></div>
              <div id="quizContent">
                <div class="d-flex justify-content-between text-muted small mb-2">
                  <span id="questionNumber"></span>
                  <span id="progressText"></span>
                </div>
                <div class="progress mb-4" role="progressbar" aria-label="Quiz progress">
                  <div id="progressBar" class="progress-bar bg-primary" style="width: 0%"></div>
                </div>
                <h2 id="questionText" class="h4 mb-4"></h2>
                <div id="answerChoices" class="d-grid gap-3"></div>
                <button type="button" id="nextButton" class="btn btn-primary mt-4 px-4">Next</button>
              </div>
            </div>
          </section>
        </div>
      </div>
    </div>
  </main>
  <script src="js/auth.js"></script>
  <script src="js/quiz.js"></script>
</body>
</html>
