<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Quiz | Register</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="page-wrap d-flex align-items-center py-5">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-12 col-sm-10 col-md-8 col-lg-6">
          <section class="card app-card">
            <div class="card-body p-4 p-md-5">
              <h1 class="brand-title text-center h2 mb-2">Create account</h1>
              <p class="text-muted text-center mb-4">Register to take the student quiz.</p>
              <div id="registerMessage"></div>
              <form id="registerForm" novalidate>
                <div class="mb-3">
                  <label for="fullName" class="form-label">Full Name</label>
                  <input type="text" class="form-control" id="fullName" placeholder="Your full name">
                </div>
                <div class="mb-3">
                  <label for="registerEmail" class="form-label">Email</label>
                  <input type="email" class="form-control" id="registerEmail" placeholder="name@example.com">
                </div>
                <div class="mb-3">
                  <label for="registerPassword" class="form-label">Password</label>
                  <input type="password" class="form-control" id="registerPassword" placeholder="At least 6 characters">
                </div>
                <div class="mb-4">
                  <label for="confirmPassword" class="form-label">Confirm Password</label>
                  <input type="password" class="form-control" id="confirmPassword" placeholder="Repeat your password">
                </div>
                <button type="submit" class="btn btn-primary w-100">Register</button>
              </form>
              <p class="text-center text-muted mt-4 mb-0">Already registered? <a href="index.html">Login</a></p>
            </div>
          </section>
        </div>
      </div>
    </div>
  </main>
  <script src="js/auth.js"></script>
</body>
</html>
