<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Quiz | Result</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="page-wrap d-flex align-items-center py-5">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">
          <section class="card app-card text-center">
            <div class="card-body p-4 p-md-5">
              <p class="text-muted mb-2">Quiz complete</p>
              <h1 class="brand-title h2 mb-4">Well done, <span id="resultName"></span>!</h1>
              <div class="row g-3 mb-4">
                <div class="col-6">
                  <div class="border rounded p-3 h-100">
                    <p class="text-muted small mb-1">Your score</p>
                    <p id="scoreText" class="h3 mb-0"></p>
                  </div>
                </div>
                <div class="col-6">
                  <div class="border rounded p-3 h-100">
                    <p class="text-muted small mb-1">Percentage</p>
                    <p id="percentageText" class="h3 mb-0"></p>
                  </div>
                </div>
              </div>
              <div id="resultMessage" class="alert mb-4" role="alert"></div>
              <div class="d-grid gap-2 d-sm-flex justify-content-sm-center">
                <button type="button" id="tryAgainButton" class="btn btn-primary px-4">Try Again</button>
                <button type="button" id="resultLogoutButton" class="btn btn-outline-secondary px-4">Logout</button>
              </div>
            </div>
          </section>
        </div>
      </div>
    </div>
  </main>
  <script src="js/auth.js"></script>
  <script src="js/result.js"></script>
</body>
</html>
